
name: CI - Pruebas API Tareas

on:
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: api_tareas
          POSTGRES_USER: api_user
          POSTGRES_PASSWORD: clave_api123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api_user -d api_tareas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        run: ./mvnw clean test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/api_tareas
          DB_USERNAME: api_user
          DB_PASSWORD: clave_api123
